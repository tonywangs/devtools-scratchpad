[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "site-link-inspector"
version = "0.1.0"
description = "Offline static-site link checks with an explorable report"
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "README.md"

[project.scripts]
site-link-inspector = "site_link_inspector.cli:main"

[tool.setuptools.package-data]
site_link_inspector = ["report.html"]

[tool.setuptools.packages.find]
include = ["site_link_inspector*"]
